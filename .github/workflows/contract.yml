name: API contract

# Fails when PageWeave renames, moves, or removes an operation this package
# uses. Runs weekly so drift is caught before a release, not by a user.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check the PageWeave API contract
        run: node scripts/check-contract.mjs
