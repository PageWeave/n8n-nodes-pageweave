name: Publish

# Publishes the package on a version tag (v0.0.1, v0.1.0, ...).
#
# npm Trusted Publishing (OIDC) authenticates the workflow. There is no
# NPM_TOKEN secret: GitHub mints a short-lived identity token, npm exchanges it
# for publish access, and npm attaches a provenance attestation automatically.
#
# Required package settings on npmjs.com → package → Settings → Trusted publishing:
#   Provider:          GitHub Actions
#   Organization:      PageWeave
#   Repository:        n8n-nodes-pageweave
#   Workflow filename: publish.yml
#   Allowed actions:   npm publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  # Mints the OIDC token used by npm trusted publishing and provenance.
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # Never cache release builds: the tarball must match the tagged commit.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # `prepublishOnly` rejects a bare `npm publish`; n8n-node release sets
      # RELEASE_MODE and NPM_CONFIG_PROVENANCE, then lints, builds, and publishes.
      - name: Publish with provenance
        run: npm run release
